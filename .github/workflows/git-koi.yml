name: Generate Git Koi

on:
  schedule:
    # Runs automatically every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually run it anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Koi Fish Gif
        uses: yalongwastaken/git-koi@v1
        with:
          # Generates the koi based on your profile history
          github_username: ${{ github.repository_owner }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi.gif
          git diff-index --quiet HEAD || git commit -m "Update git-koi animation"
          git push
